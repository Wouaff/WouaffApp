<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b11" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wouaff" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="index, follow" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!--seo-meta-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/logo/logo.png" />
  <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon-180.png" />
  <style>
    /* Empêche le zoom accidentel (double-tap / pincement) sur mobile */
    html,
    body {
      touch-action: manipulation;
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Wouaff",
    "url": "https://wouaff.app/",
    "description": "Posts, vidéos, communautés, MP chiffrés. Zéro pub. Tes données restent en France."
  }
  </script>
  <script defer src="https://wouaff.statuspage.io/embed/script.js"></script>
</head>
<body>
  <div id="root">
    <div id="loadingOverlay" class="loading-overlay" style="position:fixed;inset:0;background:#0b0b11;display:flex;align-items:center;justify-content:center;z-index:99999">
      <div class="loading-content" style="text-align:center">
        <div class="spinner" style="width:40px;height:40px;border:3px solid var(--surface);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div>
        <div style="color:var(--text-muted);font-size:14px">Wouaff</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
