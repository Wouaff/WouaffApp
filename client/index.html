<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0b13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wouaff" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="index, follow" />
  <!--seo-meta-->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/assets/logo/icon.ico" />
  <link rel="icon" type="image/png" href="/assets/logo/logo.png" />
  <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon-180.png" />
  <style>
    /* Empêche le zoom accidentel (double-tap / pincement) sur mobile */
    html,
    body {
      touch-action: manipulation;
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Wouaff",
    "url": "https://wouaff.app/",
    "description": "Posts, vidéos, communautés, MP chiffrés. Zéro pub. Tes données restent en France."
  }
  </script>
  <script defer src="https://wouaff.statuspage.io/embed/script.js"></script>
</head>
<body>
  <div id="root">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Wouaff, Réseau social français, zéro pub</h1>
    <div id="loadingOverlay" class="loading-overlay" style="position:fixed;inset:0;background:#0e0b13;display:flex;align-items:center;justify-content:center;z-index:99999">
      <div class="loading-content" style="text-align:center">
        <div class="spinner" style="width:40px;height:40px;border:3px solid #2e2540;border-top-color:#ffc24b;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div>
        <div style="color:#8c7f9e;font-size:14px">Wouaff</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
